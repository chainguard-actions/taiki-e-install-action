name: Test pinned version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: parse-changelog@0.6.18
          fallback: none
      - name: Assert pinned version installed
        run: |
          out="$(parse-changelog --version)"
          echo "version: $out"
          if [ "$out" != "parse-changelog 0.6.18" ]; then
            echo "FAIL: expected 'parse-changelog 0.6.18'"
            exit 1
          fi
          echo "PASS"
