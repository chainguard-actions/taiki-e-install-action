name: Test install of a pinned tool version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt@3.8.0
      - name: Assert the pinned version is installed
        run: |
          ACTUAL="$(shfmt --version)"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            *3.8.0*) echo "PASS" ;;
            *) echo "FAIL: expected shfmt 3.8.0"; exit 1 ;;
          esac
