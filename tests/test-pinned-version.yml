name: Test pinned version (shfmt@3.13.1)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt@3.13.1
          fallback: none
      - name: Assert exact shfmt version installed
        run: |
          out="$(shfmt --version)"
          echo "version output: $out"
          if [ "$out" != "v3.13.1" ] && [ "$out" != "3.13.1" ]; then
            echo "FAIL: expected shfmt 3.13.1"
            exit 1
          fi
          echo "PASS"
