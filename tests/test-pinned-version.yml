name: Test pinned version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt@3.14.1
      - name: Assert pinned shfmt version installed
        run: |
          VERSION="$(shfmt --version)"
          echo "version: $VERSION"
          case "$VERSION" in
            *3.14.1*) echo "PASS" ;;
            *) echo "FAIL: expected version 3.14.1"; exit 1 ;;
          esac
