name: Test basic install (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: parse-changelog
      - name: Assert parse-changelog is installed and on PATH
        run: |
          path="$(command -v parse-changelog || true)"
          echo "installed at: $path"
          if [ -z "$path" ]; then
            echo "FAIL: parse-changelog not found on PATH"
            exit 1
          fi
          out="$(parse-changelog --version)"
          echo "version: $out"
          case "$out" in
            parse-changelog\ *) echo "PASS" ;;
            *) echo "FAIL: unexpected version output"; exit 1 ;;
          esac
