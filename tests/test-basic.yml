name: Test basic usage (install latest just)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: just
      - name: Assert just is installed and on PATH
        run: |
          echo "PATH: $PATH"
          if ! command -v just >/dev/null 2>&1; then
            echo "FAIL: just not found on PATH"
            exit 1
          fi
          OUT="$(just --version)"
          echo "just --version: $OUT"
          case "$OUT" in
            just\ *) echo "PASS" ;;
            *) echo "FAIL: unexpected version output"; exit 1 ;;
          esac
