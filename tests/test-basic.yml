name: Test basic tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Debug environment
        run: |
          echo "GITHUB_ACTION_PATH: ${GITHUB_ACTION_PATH:-not set}"
          echo "RUNNER_OS: ${RUNNER_OS:-not set}"
          echo "RUNNER_ARCH: ${RUNNER_ARCH:-not set}"
          echo "HOME: $HOME"
          which bash
          bash --version | head -1
      - name: Install just
        id: action
        uses: .
        with:
          tool: just
      - name: Assert just is installed and functional
        run: |
          # Add common install locations to PATH in case GITHUB_PATH wasn't processed
          export PATH="$HOME/.install-action/bin:$HOME/.cargo/bin:$PATH"
          echo "PATH: $PATH"
          echo "Checking just installation..."
          if ! command -v just > /dev/null 2>&1; then
            echo "FAIL: just command not found"
            echo "Contents of ~/.install-action/bin (if exists):"
            ls -la "$HOME/.install-action/bin" 2>/dev/null || echo "  (directory not found)"
            echo "Contents of ~/.cargo/bin (if exists):"
            ls -la "$HOME/.cargo/bin" 2>/dev/null || echo "  (directory not found)"
            exit 1
          fi
          VERSION=$(just --version)
          echo "PASS: just installed: $VERSION"
