name: Test basic install of a single tool
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt
      - name: Assert shfmt is installed and on PATH
        run: |
          if ! command -v shfmt >/dev/null; then
            echo "FAIL: shfmt not found on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          VERSION="$(shfmt --version)"
          echo "shfmt version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: shfmt --version printed nothing"
            exit 1
          fi
          printf 'a=1\n' | shfmt >/dev/null || { echo "FAIL: shfmt did not run"; exit 1; }
          echo "PASS"
