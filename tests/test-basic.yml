name: Test basic install (just)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: just
      - name: Assert just is installed and on PATH
        run: |
          if ! command -v just >/dev/null 2>&1; then
            echo "FAIL: just not found on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          OUT="$(just --version)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q '^just [0-9]'; then
            echo "FAIL: unexpected just --version output"
            exit 1
          fi
          echo "PASS"
