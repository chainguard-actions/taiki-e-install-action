name: Test basic tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck
        id: action
        uses: .
        with:
          tool: shellcheck
      - name: Assert shellcheck is installed and runnable
        run: |
          echo "Checking shellcheck is in PATH..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found in PATH"
            exit 1
          fi
          echo "shellcheck found at: $(command -v shellcheck)"
          VERSION_OUTPUT="$(shellcheck --version)"
          echo "shellcheck version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "version:"; then
            echo "FAIL: shellcheck --version did not produce expected output"
            exit 1
          fi
          echo "PASS: shellcheck installed and working"
