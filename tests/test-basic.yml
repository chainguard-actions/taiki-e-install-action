name: Test basic install (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt
      - name: Assert shfmt is installed and on PATH
        run: |
          if ! command -v shfmt >/dev/null; then
            echo "FAIL: shfmt not found in PATH ($PATH)"
            exit 1
          fi
          echo "shfmt at: $(command -v shfmt)"
          VERSION="$(shfmt --version)"
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: shfmt --version returned nothing"
            exit 1
          fi
          echo "PASS"
      - name: Assert shfmt works
        run: |
          OUT="$(printf 'if true;then\necho hi\nfi\n' | shfmt)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q '^if true; then$'; then
            echo "FAIL: shfmt did not format as expected"
            exit 1
          fi
          echo "PASS"
