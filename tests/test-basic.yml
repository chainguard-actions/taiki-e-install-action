name: Test basic tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jaq (latest)
        id: install
        uses: .
        with:
          tool: jaq

      - name: Assert jaq is installed and executable
        run: |
          echo "Checking jaq is in PATH..."
          if ! command -v jaq > /dev/null 2>&1; then
            echo "FAIL: jaq not found in PATH"
            exit 1
          fi
          echo "PASS: jaq found at $(command -v jaq)"

      - name: Assert jaq runs correctly
        run: |
          echo "Running jaq to verify it works..."
          RESULT=$(echo '{"hello":"world"}' | jaq -r '.hello')
          echo "actual: $RESULT"
          if [ "$RESULT" != "world" ]; then
            echo "FAIL: expected 'world' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: jaq works correctly"
