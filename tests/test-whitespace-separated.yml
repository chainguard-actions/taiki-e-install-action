name: Test whitespace-separated tool list
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install tools using whitespace-separated list
        id: install
        uses: .
        with:
          tool: |
            shellcheck
            shfmt
      - name: Assert shellcheck is installed
        run: |
          echo "Checking shellcheck installation..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck command not found in PATH"
            exit 1
          fi
          echo "shellcheck version: $(shellcheck --version)"
          echo "PASS: shellcheck is installed"
      - name: Assert shfmt is installed
        run: |
          echo "Checking shfmt installation..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt command not found in PATH"
            exit 1
          fi
          echo "shfmt version: $(shfmt --version)"
          echo "PASS: shfmt is installed"
