name: Test multiple tools with pinned version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: just@1.58.0, typos
      - name: Assert pinned just version installed
        run: |
          OUT="$(just --version)"
          echo "just: $OUT"
          if [ "$OUT" != "just 1.58.0" ]; then
            echo "FAIL: expected 'just 1.58.0'"
            exit 1
          fi
          echo "PASS"
      - name: Assert typos installed
        run: |
          if ! command -v typos >/dev/null; then
            echo "FAIL: typos not found in PATH"
            exit 1
          fi
          OUT="$(typos --version)"
          echo "typos: $OUT"
          case "$OUT" in
            typos*) echo "PASS" ;;
            *) echo "FAIL: unexpected typos version output"; exit 1 ;;
          esac
