name: Test tool installation with checksum verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt@3.10.0
          checksum: 'true'
      - name: Assert shfmt installed with checksum verification
        run: |
          echo "Checking shfmt installation with checksum enabled..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt not found in PATH"
            exit 1
          fi
          SHFMT_VERSION=$(shfmt --version 2>&1)
          echo "shfmt version: $SHFMT_VERSION"
          if ! echo "$SHFMT_VERSION" | grep -q "3.10.0"; then
            echo "FAIL: expected shfmt 3.10.0, got: $SHFMT_VERSION"
            exit 1
          fi
          echo "PASS: shfmt installed successfully with checksum verification"
