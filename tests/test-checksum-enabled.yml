name: Test tool installation with checksum enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt
          checksum: 'true'
      - name: Assert shfmt is installed
        run: |
          echo "Checking if shfmt is installed..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt was not found in PATH"
            exit 1
          fi
          SHFMT_VERSION=$(shfmt --version)
          echo "PASS: shfmt is installed with checksum verification: $SHFMT_VERSION"
