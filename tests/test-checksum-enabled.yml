name: Test tool installation with checksum enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck with checksum enabled (default)
        id: action
        uses: .
        with:
          tool: shellcheck
          checksum: 'true'
      - name: Assert shellcheck is installed
        run: |
          echo "Checking shellcheck installation with checksum enabled..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck command not found in PATH"
            exit 1
          fi
          echo "shellcheck version: $(shellcheck --version)"
          echo "PASS: shellcheck installed successfully with checksum verification"
