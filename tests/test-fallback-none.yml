name: Test installation with fallback disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install tool with fallback=none
        id: action
        uses: .
        with:
          tool: shellcheck
          fallback: 'none'
      - name: Assert shellcheck is installed with fallback disabled
        run: |
          echo "Checking shellcheck..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found on PATH"
            exit 1
          fi
          VERSION="$(shellcheck --version 2>&1 | head -2)"
          echo "shellcheck version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: shellcheck --version returned empty"
            exit 1
          fi
          echo "PASS: shellcheck installed with fallback=none"
