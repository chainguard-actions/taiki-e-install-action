name: Test installation with fallback disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shfmt with fallback disabled
        id: install
        uses: .
        with:
          tool: shfmt
          fallback: none
      - name: Assert shfmt is installed
        run: |
          echo "Checking shfmt installation with fallback=none..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt command not found in PATH"
            exit 1
          fi
          echo "shfmt version: $(shfmt --version)"
          echo "PASS: shfmt is installed even with fallback=none"
