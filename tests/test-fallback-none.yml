name: Test installation with fallback disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck with fallback disabled
        id: action
        uses: .
        with:
          tool: shellcheck
          fallback: none
      - name: Assert shellcheck is installed
        run: |
          # Add common install locations to PATH in case GITHUB_PATH wasn't processed
          export PATH="$HOME/.install-action/bin:$HOME/.cargo/bin:$PATH"
          echo "Checking shellcheck installation (no fallback)..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck command not found"
            echo "Contents of ~/.install-action/bin (if exists):"
            ls -la "$HOME/.install-action/bin" 2>/dev/null || echo "  (directory not found)"
            exit 1
          fi
          echo "PASS: shellcheck installed: $(shellcheck --version | head -2)"
