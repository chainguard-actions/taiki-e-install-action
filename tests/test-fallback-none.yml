name: Test installation with fallback disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install tool with fallback set to none
        id: action
        uses: .
        with:
          tool: shellcheck
          fallback: 'none'
      - name: Assert shellcheck is installed
        run: |
          echo "Checking shellcheck installation (fallback=none)..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck command not found in PATH"
            exit 1
          fi
          echo "PASS: shellcheck installed: $(shellcheck --version | head -1)"
