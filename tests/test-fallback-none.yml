name: Test tool installation with fallback disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: just
          fallback: 'none'
      - name: Assert just is installed even without fallback
        run: |
          echo "Checking if just is installed (fallback=none)..."
          if ! command -v just > /dev/null 2>&1; then
            echo "FAIL: just was not found in PATH"
            exit 1
          fi
          echo "PASS: just is installed without fallback: $(just --version)"
