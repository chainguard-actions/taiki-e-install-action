name: Test installation with fallback disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shellcheck
          fallback: none
      - name: Assert shellcheck is installed with fallback=none
        run: |
          echo "Checking shellcheck installation..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck is not installed"
            exit 1
          fi
          echo "shellcheck version: $(shellcheck --version | head -2 | tail -1)"
          echo "PASS: shellcheck is installed with fallback=none"
