name: Test tool installation with fallback disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install
        uses: .
        with:
          tool: shellcheck
          fallback: 'none'
      - name: Assert shellcheck is installed with fallback=none
        run: |
          echo "Checking shellcheck installation (fallback=none)..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found in PATH"
            exit 1
          fi
          VERSION="$(shellcheck --version | head -2 | tail -1)"
          echo "shellcheck version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: shellcheck --version returned empty"
            exit 1
          fi
          echo "PASS: shellcheck is installed with fallback=none"
