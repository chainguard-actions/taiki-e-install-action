name: Test multiple tools installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install multiple tools
        id: action
        uses: .
        with:
          tool: just,shfmt
      - name: Assert just is installed
        run: |
          # Add common install locations to PATH in case GITHUB_PATH wasn't processed
          export PATH="$HOME/.install-action/bin:$HOME/.cargo/bin:$PATH"
          echo "Checking just installation..."
          if ! command -v just > /dev/null 2>&1; then
            echo "FAIL: just command not found"
            echo "Contents of ~/.install-action/bin (if exists):"
            ls -la "$HOME/.install-action/bin" 2>/dev/null || echo "  (directory not found)"
            exit 1
          fi
          echo "PASS: just found: $(just --version)"
      - name: Assert shfmt is installed
        run: |
          # Add common install locations to PATH in case GITHUB_PATH wasn't processed
          export PATH="$HOME/.install-action/bin:$HOME/.cargo/bin:$PATH"
          echo "Checking shfmt installation..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt command not found"
            echo "Contents of ~/.install-action/bin (if exists):"
            ls -la "$HOME/.install-action/bin" 2>/dev/null || echo "  (directory not found)"
            exit 1
          fi
          echo "PASS: shfmt found: $(shfmt --version)"
