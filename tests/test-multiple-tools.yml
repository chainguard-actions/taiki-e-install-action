name: Test multiple tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install multiple tools
        id: action
        uses: .
        with:
          tool: just,shellcheck
      - name: Assert just is installed
        run: |
          echo "Checking just installation..."
          if ! command -v just > /dev/null 2>&1; then
            echo "FAIL: just command not found in PATH"
            exit 1
          fi
          echo "just version: $(just --version)"
          echo "PASS: just is installed"
      - name: Assert shellcheck is installed
        run: |
          echo "Checking shellcheck installation..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck command not found in PATH"
            exit 1
          fi
          echo "shellcheck version: $(shellcheck --version)"
          echo "PASS: shellcheck is installed"
