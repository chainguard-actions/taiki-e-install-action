name: Test multiple tools (comma and whitespace separated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt, just
          fallback: none
      - name: Assert both tools installed
        run: |
          for t in shfmt just; do
            if ! command -v "$t" >/dev/null; then
              echo "FAIL: $t not found in PATH"
              exit 1
            fi
            echo "$t at $(command -v "$t"): $("$t" --version)"
          done
          echo "PASS"
