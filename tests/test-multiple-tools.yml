name: Test multiple tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install multiple tools (shellcheck and shfmt)
        id: install
        uses: .
        with:
          tool: shellcheck,shfmt

      - name: Assert shellcheck is installed
        run: |
          echo "Checking shellcheck is on PATH..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found on PATH"
            exit 1
          fi
          echo "shellcheck found at: $(command -v shellcheck)"
          echo "PASS: shellcheck is installed"

      - name: Assert shfmt is installed
        run: |
          echo "Checking shfmt is on PATH..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt not found on PATH"
            exit 1
          fi
          echo "shfmt found at: $(command -v shfmt)"
          VERSION_OUTPUT="$(shfmt --version)"
          echo "shfmt version: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: shfmt --version returned empty output"
            exit 1
          fi
          echo "PASS: shfmt is installed"
