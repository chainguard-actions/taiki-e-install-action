name: Test multiple tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install multiple tools via action
        id: install
        uses: .
        with:
          tool: shfmt,shellcheck
      - name: Assert shfmt is installed
        run: |
          # shfmt has rust_crate: null so it always installs to ~/.install-action/bin
          export PATH="$PATH:$HOME/.install-action/bin:$HOME/.cargo/bin"
          echo "Checking install-action bin dir..."
          ls -la "$HOME/.install-action/bin/" 2>/dev/null || echo "(install-action bin dir not found)"
          echo "Checking shfmt is available..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt not found in PATH"
            exit 1
          fi
          echo "shfmt version: $(shfmt --version 2>&1)"
          echo "PASS: shfmt is installed"
      - name: Assert shellcheck is installed
        run: |
          # shellcheck has rust_crate: null so it always installs to ~/.install-action/bin
          export PATH="$PATH:$HOME/.install-action/bin:$HOME/.cargo/bin"
          echo "Checking shellcheck is available..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found in PATH"
            exit 1
          fi
          echo "shellcheck version: $(shellcheck --version 2>&1 | head -2)"
          echo "PASS: shellcheck is installed"
