name: Test installing multiple tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install multiple tools via install-action
        id: action
        uses: .
        with:
          tool: just, shfmt
      - name: Assert just is installed
        run: |
          echo "Checking just installation..."
          if ! command -v just > /dev/null 2>&1; then
            echo "FAIL: just not found in PATH"
            exit 1
          fi
          JUST_VERSION=$(just --version 2>&1)
          echo "just version: $JUST_VERSION"
          echo "PASS: just is installed"
      - name: Assert shfmt is installed
        run: |
          echo "Checking shfmt installation..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt not found in PATH"
            exit 1
          fi
          SHFMT_VERSION=$(shfmt --version 2>&1)
          echo "shfmt version: $SHFMT_VERSION"
          echo "PASS: shfmt is installed"
