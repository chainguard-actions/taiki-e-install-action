name: Test installing multiple tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shellcheck,shfmt
      - name: Assert shellcheck is installed
        run: |
          echo "Checking if shellcheck is installed..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck was not found in PATH"
            exit 1
          fi
          echo "PASS: shellcheck is installed: $(shellcheck --version | head -1)"
      - name: Assert shfmt is installed
        run: |
          echo "Checking if shfmt is installed..."
          if ! command -v shfmt > /dev/null 2>&1; then
            echo "FAIL: shfmt was not found in PATH"
            exit 1
          fi
          echo "PASS: shfmt is installed: $(shfmt --version)"
