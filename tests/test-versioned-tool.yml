name: Test versioned tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install specific version of shellcheck
        id: action
        uses: .
        with:
          tool: shellcheck@0.10.0
      - name: Assert shellcheck is installed at the correct version
        run: |
          echo "Checking shellcheck is on PATH..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found on PATH"
            exit 1
          fi
          VERSION_OUTPUT="$(shellcheck --version)"
          echo "shellcheck version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: shellcheck --version returned empty"
            exit 1
          fi
          if echo "$VERSION_OUTPUT" | grep -q "0.10.0"; then
            echo "PASS: correct version 0.10.0 installed"
          else
            echo "FAIL: expected version 0.10.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
