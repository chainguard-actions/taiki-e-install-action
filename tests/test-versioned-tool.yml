name: Test versioned tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt@3.8.0
      - name: Assert versioned tool is installed
        run: |
          # The action adds ~/.install-action/bin to GITHUB_PATH.
          # Under act, GITHUB_PATH may not be picked up between steps,
          # so also check the install-action bin dir directly.
          INSTALL_BIN="${HOME}/.install-action/bin"
          export PATH="${PATH}:${INSTALL_BIN}"
          echo "PATH: $PATH"
          echo "Checking if shfmt is installed..."
          SHFMT_BIN=""
          if command -v shfmt > /dev/null 2>&1; then
            SHFMT_BIN="shfmt"
          elif [ -f "${INSTALL_BIN}/shfmt" ]; then
            SHFMT_BIN="${INSTALL_BIN}/shfmt"
          else
            echo "FAIL: shfmt was not found in PATH or ${INSTALL_BIN}"
            ls -la "${INSTALL_BIN}" 2>/dev/null || echo "Install bin dir does not exist"
            exit 1
          fi
          INSTALLED_VERSION="$("${SHFMT_BIN}" --version)"
          echo "shfmt version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "v3.8.0" ]; then
            echo "FAIL: expected version v3.8.0, got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: shfmt v3.8.0 is installed"
