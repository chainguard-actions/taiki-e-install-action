name: Test versioned tool installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: just@1.51.0
      - name: Assert just version matches
        run: |
          echo "Checking if just is available..."
          if ! command -v just > /dev/null 2>&1; then
            echo "FAIL: just command not found after installation"
            exit 1
          fi
          ACTUAL_VERSION=$(just --version | awk '{print $2}')
          echo "actual version: $ACTUAL_VERSION"
          if [ "$ACTUAL_VERSION" != "1.51.0" ]; then
            echo "FAIL: expected version 1.51.0, got $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: just@1.51.0 installed successfully"
