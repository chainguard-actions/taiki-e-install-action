name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install specific version of shellcheck
        id: action
        uses: .
        with:
          tool: shellcheck@0.10.0
      - name: Assert shellcheck version matches requested
        run: |
          echo "Checking shellcheck is available..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found in PATH"
            exit 1
          fi
          VERSION=$(shellcheck --version 2>&1)
          echo "shellcheck version output: $VERSION"
          if ! echo "$VERSION" | grep -q '0.10.0'; then
            echo "FAIL: expected version 0.10.0 but got: $VERSION"
            exit 1
          fi
          echo "PASS: shellcheck 0.10.0 is installed"
