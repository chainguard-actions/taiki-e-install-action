name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck at a specific version
        id: install
        uses: .
        with:
          tool: shellcheck@0.10.0

      - name: Assert shellcheck version 0.10.0 is installed
        run: |
          echo "Checking shellcheck is on PATH..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found on PATH"
            exit 1
          fi
          VERSION_OUTPUT="$(shellcheck --version)"
          echo "version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q '0\.10\.0'; then
            echo "FAIL: expected shellcheck version 0.10.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: shellcheck 0.10.0 is installed"
