name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck at specific version
        id: action
        uses: .
        with:
          tool: shellcheck@0.10.0
      - name: Assert shellcheck version is exactly 0.10.0
        run: |
          echo "Checking shellcheck version..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found in PATH"
            exit 1
          fi
          VERSION_OUTPUT="$(shellcheck --version)"
          echo "shellcheck version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "0.10.0"; then
            echo "FAIL: expected shellcheck version 0.10.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: shellcheck 0.10.0 installed correctly"
