name: Test fallback none with supported tool succeeds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt
          fallback: none
      - name: Assert shfmt installed
        run: |
          p="$(command -v shfmt || true)"
          echo "shfmt: $p"
          if [ -z "$p" ]; then
            echo "FAIL: shfmt not found on PATH"
            exit 1
          fi
          shfmt --version
          echo "PASS"
