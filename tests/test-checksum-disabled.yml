name: Test tool installation with checksum disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt
          checksum: 'false'
      - name: Assert tool is installed without checksum verification
        run: |
          # The action adds ~/.install-action/bin to GITHUB_PATH.
          # Under act, GITHUB_PATH may not be picked up between steps,
          # so also check the install-action bin dir directly.
          INSTALL_BIN="${HOME}/.install-action/bin"
          export PATH="${PATH}:${INSTALL_BIN}"
          echo "PATH: $PATH"
          echo "Checking if shfmt is installed..."
          if command -v shfmt > /dev/null 2>&1; then
            echo "shfmt version: $(shfmt --version)"
            echo "PASS: shfmt installed successfully with checksum disabled"
          elif [ -f "${INSTALL_BIN}/shfmt" ]; then
            echo "shfmt found at ${INSTALL_BIN}/shfmt"
            echo "shfmt version: $("${INSTALL_BIN}/shfmt" --version)"
            echo "PASS: shfmt installed successfully with checksum disabled"
          else
            echo "FAIL: shfmt was not found in PATH or ${INSTALL_BIN}"
            ls -la "${INSTALL_BIN}" 2>/dev/null || echo "Install bin dir does not exist"
            exit 1
          fi
