name: Test installation with checksum disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: typos
          checksum: 'false'
      - name: Assert typos is installed
        run: |
          echo "Checking typos is available..."
          if ! command -v typos > /dev/null 2>&1; then
            echo "FAIL: typos not found in PATH"
            exit 1
          fi
          echo "typos version: $(typos --version)"
          echo "PASS: typos is installed (checksum disabled)"
