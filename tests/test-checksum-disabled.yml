name: Test tool installation with checksum disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install ripgrep with checksum disabled
        id: action
        uses: .
        with:
          tool: ripgrep
          checksum: 'false'
      - name: Assert ripgrep is installed
        run: |
          echo "Checking ripgrep installation (checksum disabled)..."
          if ! command -v rg > /dev/null 2>&1; then
            echo "FAIL: rg (ripgrep) not found in PATH"
            exit 1
          fi
          RG_VERSION=$(rg --version 2>&1 | head -1)
          echo "rg version: $RG_VERSION"
          if [ -z "$RG_VERSION" ]; then
            echo "FAIL: rg --version returned empty"
            exit 1
          fi
          echo "PASS: ripgrep is installed with checksum disabled"
