name: Test installation with checksum disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck with checksum disabled
        id: action
        uses: .
        with:
          tool: shellcheck
          checksum: 'false'
      - name: Assert shellcheck is installed even without checksum
        run: |
          echo "Checking shellcheck installation..."
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "FAIL: shellcheck not found in PATH"
            exit 1
          fi
          SC_VERSION=$(shellcheck --version 2>&1 | head -2)
          echo "shellcheck version: $SC_VERSION"
          echo "PASS: shellcheck installed successfully with checksum disabled"
