name: Test checksum disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: shfmt
          checksum: 'false'
          fallback: none
      - name: Assert shfmt installed
        run: |
          if ! command -v shfmt >/dev/null 2>&1; then
            echo "FAIL: shfmt not found on PATH"
            exit 1
          fi
          echo "shfmt version: $(shfmt --version)"
          echo "PASS"
