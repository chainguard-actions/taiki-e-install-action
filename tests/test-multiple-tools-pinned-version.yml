name: Test multiple tools with pinned versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: just@1.59.0, shfmt
      - name: Assert just pinned version installed
        run: |
          OUT="$(just --version)"
          echo "actual: $OUT"
          if [ "$OUT" != "just 1.59.0" ]; then
            echo "FAIL: expected 'just 1.59.0'"
            exit 1
          fi
          echo "PASS"
      - name: Assert shfmt installed
        run: |
          if ! command -v shfmt >/dev/null; then
            echo "FAIL: shfmt not found on PATH"
            exit 1
          fi
          OUT="$(shfmt --version)"
          echo "actual: $OUT"
          if [ -z "$OUT" ]; then
            echo "FAIL: empty shfmt version"
            exit 1
          fi
          echo "PASS"
