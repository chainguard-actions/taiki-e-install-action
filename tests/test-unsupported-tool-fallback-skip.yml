name: Test unsupported tool with fallback skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: definitely-not-a-real-tool-xyz
          fallback: skip
      - name: Assert tool was skipped (not installed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if command -v definitely-not-a-real-tool-xyz >/dev/null 2>&1; then
            echo "FAIL: tool unexpectedly installed"
            exit 1
          fi
          echo "PASS"
