name: Test cargo-binstall installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: cargo-binstall
      - name: Assert cargo-binstall is installed
        run: |
          echo "Checking if cargo-binstall is available..."
          if ! command -v cargo-binstall > /dev/null 2>&1; then
            echo "FAIL: cargo-binstall not found in PATH"
            exit 1
          fi
          echo "cargo-binstall version: $(cargo-binstall --version)"
          echo "PASS: cargo-binstall installed successfully"
