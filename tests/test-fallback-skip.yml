name: Test unsupported tool with fallback skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: actionchain-nonexistent-tool-xyz
          fallback: skip
      - name: Assert tool was skipped (not installed)
        run: |
          if command -v actionchain-nonexistent-tool-xyz >/dev/null 2>&1; then
            echo "FAIL: unexpected binary installed"
            exit 1
          fi
          echo "PASS: unsupported tool skipped and action succeeded"
