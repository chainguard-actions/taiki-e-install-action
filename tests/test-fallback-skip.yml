name: Test fallback skip for unsupported tool
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: definitely-not-a-real-tool-xyz
          fallback: skip
      - name: Assert unsupported tool was skipped (not installed)
        run: |
          if command -v definitely-not-a-real-tool-xyz >/dev/null; then
            echo "FAIL: unexpected tool found in PATH"
            exit 1
          fi
          echo "PASS: unsupported tool skipped and action succeeded"
