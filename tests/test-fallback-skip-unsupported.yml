name: Test fallback skip with unsupported tool succeeds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: this-tool-does-not-exist-xyz
          fallback: skip
      - name: Assert tool was skipped
        run: |
          if command -v this-tool-does-not-exist-xyz >/dev/null 2>&1; then
            echo "FAIL: unexpected binary installed"
            exit 1
          fi
          echo "PASS: unsupported tool skipped"
