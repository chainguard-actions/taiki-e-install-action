name: Test fallback skip with unsupported tool
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool: this-tool-does-not-exist-xyz
          fallback: skip
      - name: Assert step succeeded and tool was skipped
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if command -v this-tool-does-not-exist-xyz >/dev/null 2>&1; then
            echo "FAIL: skipped tool unexpectedly present"
            exit 1
          fi
          echo "PASS"
